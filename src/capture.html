<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Capture Current Windows</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
    }

    header {
      flex-shrink: 0;
      padding: 18px 22px 12px;
      border-bottom: 1px solid #0f3460;
    }
    h1 { font-size: 15px; font-weight: 600; color: #fff; }
    .sub {
      margin-top: 5px;
      font-size: 12px;
      color: #8a8aa0;
      line-height: 1.45;
    }

    .toolbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 9px 22px;
      border-bottom: 1px solid #0f3460;
      font-size: 12px;
    }
    .link {
      color: #1b9fdb;
      cursor: pointer;
      background: none;
      border: none;
      font: inherit;
      padding: 0;
    }
    .link:hover { text-decoration: underline; }
    .count { margin-left: auto; color: #8a8aa0; }

    main { flex: 1; overflow-y: auto; padding: 10px 22px; }
    main::-webkit-scrollbar { width: 9px; }
    main::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 5px; }

    .row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 10px;
      margin-bottom: 5px;
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 6px;
      cursor: pointer;
    }
    .row:hover { border-color: #1b9fdb; }
    .row.blocked { opacity: 0.55; cursor: default; }
    .row.blocked:hover { border-color: #0f3460; }
    .row input[type="checkbox"] {
      margin-top: 2px;
      flex-shrink: 0;
      accent-color: #1b9fdb;
      cursor: pointer;
    }
    .row.blocked input[type="checkbox"] { cursor: default; }

    /* min-width: 0 is what actually lets these shrink — a flex item's default
       min-width is auto, which refuses to go below its content's width and is
       why long titles pushed out of the window instead of clipping. */
    .body {
      flex: 1;
      min-width: 0;
      display: block;
      overflow: hidden;
    }
    /* display: block matters: these are <span>s, and text-overflow has no
       effect on an inline element. */
    .name {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #e8e8f4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .meta {
      display: block;
      margin-top: 2px;
      font-size: 11px;
      color: #8a8aa0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* Wraps rather than truncates — an explanation cut off mid-sentence is
       worse than two lines. */
    .note {
      display: block;
      margin-top: 3px;
      font-size: 11px;
      color: #d9a441;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }
    .note.blocked-note { color: #e07a8a; }

    .tag {
      flex-shrink: 0;
      align-self: center;
      padding: 2px 7px;
      border-radius: 10px;
      background: #0f3460;
      color: #9fb6d4;
      font-size: 10px;
      white-space: nowrap;
    }

    .empty, .loading {
      padding: 28px 4px;
      text-align: center;
      color: #8a8aa0;
      font-size: 13px;
      line-height: 1.6;
    }

    footer {
      flex-shrink: 0;
      display: flex;
      gap: 9px;
      padding: 12px 22px 16px;
      border-top: 1px solid #0f3460;
    }
    .btn {
      flex: 1;
      padding: 9px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-cancel { background: #0f3460; color: #cfd6e6; }
    .btn-cancel:hover { background: #1a4a7a; }
    .btn-add { background: #e94560; color: #fff; }
    .btn-add:hover { background: #c73652; }
    .btn-add:disabled { opacity: 0.45; cursor: default; background: #e94560; }
  </style>
</head>
<body>
  <header>
    <h1>Capture Current Windows</h1>
    <p class="sub">Adds the windows you have open, with their position, size and virtual desktop.</p>
  </header>
  <div class="toolbar">
    <button class="link" id="select-all">Select all</button>
    <button class="link" id="select-none">Select none</button>
    <button class="link" id="rescan">Rescan</button>
    <span class="count" id="count"></span>
  </div>
  <main id="list"><p class="loading">Scanning open windows…</p></main>
  <footer>
    <button class="btn btn-cancel" id="cancel">Cancel</button>
    <button class="btn btn-add" id="add" disabled>Add Selected</button>
  </footer>
  <script type="module" src="capture.js"></script>
</body>
</html>
